backend:
  name: turbo-github
  # Create the Hernani.dev site in Decap Turbo, then replace this placeholder
  # with the UUID shown on its Overview tab. This is an identifier, not a secret.
  turbo_site_id: d3afdcc6-f4e5-4b1a-92ce-3cc81e7b4b04
  branch: main

publish_mode: editorial_workflow
locale: pt
site_url: https://hernani.dev
display_url: https://hernani.dev
logo_url: /favicon.svg

media_folder: public/images/writing
public_folder: /images/writing

collections:
  - name: writing_pt
    label: Writing — Português
    label_singular: Artigo em português
    folder: src/content/writing/pt-BR
    create: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    slug_collision: reject
    preview_path: "writing/{{slug}}/"
    sortable_fields:
      - field: pubDate
        label: Data de publicação
        default_sort: desc
      - title
    fields:
      - { label: Título, name: title, widget: string, required: true }
      - { label: Descrição, name: description, widget: text, required: true, hint: "Resumo exibido no arquivo de artigos e nos metadados de busca." }
      - { label: Data de publicação, name: pubDate, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, picker_utc: true, default: "{{now}}", required: true }
      - { label: Data de atualização, name: updatedDate, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, picker_utc: true, required: false }
      - label: Assuntos
        name: tags
        widget: list
        required: false
        field: { label: Assunto, name: tag, widget: string }
      - { label: Ocultar do site público, name: draft, widget: boolean, default: false, required: true, hint: "Deixe desativado para revisar o artigo na prévia do PR. Ative apenas para impedir a geração da página mesmo depois do merge." }
      - { label: Idioma, name: locale, widget: hidden, default: "pt-BR" }
      - label: Conteúdo do artigo
        name: body
        widget: richtext
        required: true
        sanitize_preview: true
        buttons:
          - bold
          - italic
          - strikethrough
          - code
          - link
          - heading-two
          - heading-three
          - heading-four
          - quote
          - bulleted-list
          - numbered-list
        editor_components:
          - image
          - code-block
        modes:
          - rich_text
          - raw

  - name: writing_en
    label: Writing — English
    label_singular: English article
    folder: src/content/writing/en
    create: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    slug_collision: reject
    preview_path: "en/writing/{{slug}}/"
    sortable_fields:
      - field: pubDate
        label: Publication date
        default_sort: desc
      - title
    fields:
      - { label: Title, name: title, widget: string, required: true }
      - { label: Description, name: description, widget: text, required: true, hint: "Summary shown in the Writing archive and search metadata." }
      - { label: Publication date, name: pubDate, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, picker_utc: true, default: "{{now}}", required: true }
      - { label: Updated date, name: updatedDate, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, picker_utc: true, required: false }
      - label: Topics
        name: tags
        widget: list
        required: false
        field: { label: Topic, name: tag, widget: string }
      - { label: Hide from public site, name: draft, widget: boolean, default: false, required: true, hint: "Leave off to review the article in the pull request preview. Enable only to prevent page generation after merge." }
      - { label: Language, name: locale, widget: hidden, default: "en" }
      - label: Article content
        name: body
        widget: richtext
        required: true
        sanitize_preview: true
        buttons:
          - bold
          - italic
          - strikethrough
          - code
          - link
          - heading-two
          - heading-three
          - heading-four
          - quote
          - bulleted-list
          - numbered-list
        editor_components:
          - image
          - code-block
        modes:
          - rich_text
          - raw
